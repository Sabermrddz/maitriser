services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./Backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/quizapp
      JWT_SECRET: "${JWT_SECRET}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      ADMIN_SECRET_CODE: "${ADMIN_SECRET_CODE}"
      PORT: "4000"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      NODE_ENV: "${NODE_ENV:-production}"
      COOKIE_SECRET: "${COOKIE_SECRET:-}"
      DISABLE_JWT_FALLBACK: "${DISABLE_JWT_FALLBACK:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
